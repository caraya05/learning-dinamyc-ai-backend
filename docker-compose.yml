  flower:
    container_name: flower
    image: us-east4-docker.pkg.dev/qwestar-ai/back-qwestar-ai/backend-dev:latest
    command: >
      sh -c "
      cd /code &&
      mkdir -p /data &&
      sleep 15 &&
      celery 
      -A celery_worker
      flower
      --address=0.0.0.0
      --port=5555
      --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
      --persistent=True
      --db=/data/flower.db
      --state_save_interval=30000
      --broker_api=redis://:${REDIS_PASSWORD}@redis:6379/0
      --max_tasks=5000
      "
    volumes:
      - flower-data:/data
    working_dir: /code
    ports:
        - "5556:5555"
    env_file:
      - .env
    environment:
      PYTHONPATH: /code
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      FLOWER_UNAUTHENTICATED_API: "false"
      FLOWER_PERSISTENT: "true"
      FLOWER_STATE_SAVE_INTERVAL: "30000"
      FLOWER_PORT: "5555"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.1'
          memory: 128M
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

