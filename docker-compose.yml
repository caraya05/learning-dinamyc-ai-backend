services:
  fastapi:
    container_name: fastapi
    image: us-east4-docker.pkg.dev/qwestar-ai/back-qwestar-ai/backend-dev:latest
    command: >
      /bin/sh -c "echo 'Qwestar AI Backend' && sleep 1 && uvicorn main:app --reload --host 0.0.0.0 --port 9000 --forwarded-allow-ips='*' --proxy-headers --workers 2"
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    ports:
      - "9000:9000"
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:6.2-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --protected-mode no --maxmemory 512mb --maxmemory-policy allkeys-lru --tcp-backlog 256 --timeout 300 --tcp-keepalive 300
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  celery_worker:
    container_name: celery_worker
    image: us-east4-docker.pkg.dev/qwestar-ai/back-qwestar-ai/backend-dev:latest
    command: >
      sh -c "
      cd /code &&
      celery -A celery_worker worker
      --loglevel=warning
      --concurrency=1
      --max-tasks-per-child=100
      --queues=character_queue,location_queue,image_queue,voice_queue,default
      --prefetch-multiplier=2
      --pool=prefork
      --hostname=worker@%h
      --events
      --time-limit=3600
      --soft-time-limit=3300
      --without-gossip
      --without-mingle
      --without-heartbeat
      "
    volumes:
      - celery-data:/data
    working_dir: /code
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      C_FORCE_ROOT: "true"
      PYTHONPATH: /code
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cd /code && celery -A celery_worker inspect ping -d 'worker@%h' --broker='redis://:${REDIS_PASSWORD}@redis:6379/0'"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

