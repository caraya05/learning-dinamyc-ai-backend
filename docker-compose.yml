version: '3.7'

services:
  fastapi:
    container_name: fastapi
    build:
      context: .
      dockerfile: .docker/Dockerfile
    command: ./fastapi-entrypoint-loc.sh
    env_file:
      - .envs/.env
    volumes:
      - ./src/:/code
    ports:
      - "9000:9000"
    #    environment:
    #      - DATABASE_URI=postgresql://prospero_db_username:prospero_db_password@postgres/prospero_db_dev
    depends_on:
      - postgres

  postgres:
    container_name: postgres
    image: postgres:12.1-alpine
    ports:
      - 5432:5432
    volumes:
      - .postgres_data_base:/var/lib/postgresql/data/
    env_file:
      - .envs/.env_postgres

  nginx:
    container_name: nginx
    build: ./nginx
    image: nginx:latest
    depends_on:
      - fastapi
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d/:ro
      - ./nginx/ssl:/etc/ssl/:ro
      - ./src/statics:/code/statics

  redis:
    container_name: redis
    image: redis:6.2-alpine

  celery_worker:
    container_name: celery_worker
    build:
      context: .
      dockerfile: .docker/Dockerfile
    command: celery -A celery_worker.celery worker --loglevel=info
    volumes:
      - ./src/:/code
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - fastapi
      - redis


  flower:
    container_name: flower
    build:
      context: .
      dockerfile: .docker/Dockerfile
    command: celery -A celery_worker.celery flower --port=5555
    ports:
      - "5556:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - fastapi
      - redis
      - celery_worker






