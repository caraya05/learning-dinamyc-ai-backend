version: '3.8'

services:
  fastapi:
    container_name: fastapi-dev
    build:
      context: .
      dockerfile: .docker/Dockerfile
    command: >
      /bin/sh -c "echo 'Qwestar AI Backend' | figlet && sleep 1 && uvicorn main:app --reload --host 0.0.0.0 --port 9000 --forwarded-allow-ips='*' --proxy-headers"
    env_file:
      - .env
    volumes:
      - ./src/:/code
      - /etc/localtime:/etc/localtime:ro  # Sincronización de tiempo con el host
    ports:
      - "9000:9000"

  nginx:
    container_name: nginx-dev
    build:
      context: ./nginx
      dockerfile: DockerfileDevelop
    depends_on:
      - fastapi
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/dev/:/etc/nginx/conf.d/:ro
      - ./nginx/ssl:/etc/ssl/:ro
      - ./src/static:/code/static

  redis:
    container_name: redis-dev
    image: redis:6.2-alpine
    volumes:
      - /etc/localtime:/etc/localtime:ro  # Sincronización de tiempo con el host

  celery_worker:
    container_name: celery_worker
    build:
      context: .
      dockerfile: .docker/Dockerfile
    command: >
      celery -A celery_worker.celery worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=1000
      --queues=character_queue,location_queue,image_queue,voice_queue,default
      --prefetch-multiplier=1
      --pool=prefork
    volumes:
      - ./src/:/code
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    depends_on:
      - fastapi
      - redis
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped

  flower:
    container_name: flower-dev
    build:
      context: .
      dockerfile: .docker/Dockerfile
    command: celery -A celery_worker.celery flower --port=5555
    ports:
      - "5556:5555"
    env_file:
      - .env
    depends_on:
      - fastapi
      - redis
      - celery_worker