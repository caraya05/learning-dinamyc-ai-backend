version: '3.7'

services:
  fastapi:
    container_name: fastapiARM
    build:
      context: .
      dockerfile: .docker/DockerfileARM
    command: ./fastapi-entrypoint-loc.sh
    env_file:
      - .env
    volumes:
      - ./src/:/code
    ports:
      - "9000:9000"

  nginx:
    container_name: nginxARM
    build:
        context: ./nginx
        dockerfile: DockerfileARM
#    image: nginx:latest
    depends_on:
      - fastapi
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d/:ro
      - ./nginx/ssl:/etc/ssl/:ro
      - ./src/statics:/code/statics

