services:
  fastapi:
    container_name: fastapiARM
    build:
      context: .
      dockerfile: .docker/DockerfileARM
    command: ./fastapi-entrypoint-loc.sh
    env_file:
      - .env
    volumes:
      - ./src/:/code
    ports:
      - "9000:9000"
    cpu_count: 2
    restart: always

  nginx:
    container_name: nginxARM
    build:
      context: ./nginx
      dockerfile: DockerfileARM
    #    image: nginx:latest
    depends_on:
      - fastapi
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/local/:/etc/nginx/conf.d/:ro
#      - ./nginx/ssl:/etc/ssl/:ro
      - ./src/static:/code/static

  redis:
    container_name: redisARM
    image: arm64v8/redis:6.2-alpine
    volumes:
      - redis-data:/data

  flower:
    container_name: flowerARM
    build:
      context: .
      dockerfile: .docker/DockerfileARM
    command: celery -A celery_worker.celery flower --port=5555 --url_prefix=/flower
    ports:
      - "5556:5555"
    env_file:
      - .env
    depends_on:
      - celery_worker
    volumes:
      - flower-data:/data

  celery_worker:
    container_name: celery_workerARM
    build:
      context: .
      dockerfile: .docker/DockerfileCelery
    command: celery -A celery_worker.celery worker --loglevel=info --pool=solo
    volumes:
      - ./src/:/code
      - celery-data:/data
    env_file:
      - .env
    depends_on:
      - redis

volumes:
  redis-data:
  flower-data:
  celery-data: