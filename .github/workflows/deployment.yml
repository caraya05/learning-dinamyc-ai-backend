name: Deployment

on:
  push:
    branches: [ main ]

#on:
#  workflow_run:
#    workflows: ["Tests"]
#    types:
#      - completed

jobs:
  build-push:
    name: build and push image
    runs-on: ubuntu-latest
    #    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to private registry
        uses: docker/login-action@v1
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: '${{ secrets.REGISTRY_URL }}/${{secrets.NAME_PROJECT}}/${{github.event.repository.name}}:dev-${{github.run_number}}'
  deploy-k8s:
    needs: build-push       # Job depends on next-build(above) job
    name: deploy to k8s
    runs-on: ubuntu-latest
    #    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: deploy to cluster
        uses: steebchen/kubectl@v2.0.0
        env:
          NAME_DEPLOY: 'gateway'
          IMAGE_TAG: '${{ secrets.REGISTRY_URL }}/${{secrets.NAME_PROJECT}}/${{github.event.repository.name}}:dev-${{github.run_number}}'
        with: # defaults to latest kubectl binary version
          config: ${{ secrets.KUBE_CONFIG_DATA }}
          command: set image --record deployment/$NAME_DEPLOY $NAME_DEPLOY=$IMAGE_TAG --namespace=noticias-ya --insecure-skip-tls-verify
      - name: verify deployment
        uses: steebchen/kubectl@v2.0.0
        env:
          NAME_DEPLOY: 'gateway'
        with:
          command: rollout status deployment/$NAME_DEPLOY --namespace=noticias-ya --insecure-skip-tls-verify
          config: ${{ secrets.KUBE_CONFIG_DATA }}
      - name: Send slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took,pullRequest # selectable (default: repo,message)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} # required
        if: always() # Pick up events even if the job fails or is canceled.
